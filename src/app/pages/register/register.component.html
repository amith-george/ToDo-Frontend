<div class="page-wrapper">
  <div class="form-card">
    <h1 class="title">Create Account</h1>
    <p class="subtitle">Sign up to manage your tasks</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="submit-btn">Register</button>
    </form>
    
    <div class="footer">
      <a routerLink="/login">Already have an account? Login</a>
    </div>
  </div>
</div>
